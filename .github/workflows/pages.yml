name: Deploy presentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install validation tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify opening controls and animations
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 &
          npm run check:opening
      - name: Package final presentation
        run: python3 tools/build-pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy final presentation
        id: deployment
        uses: actions/deploy-pages@v4
